<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4dc">
  <title>Мишины числа</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <!-- Главный экран -->
    <section id="menu" class="screen">
      <header class="menu-head">
        <div class="mascot" aria-hidden="true">🐻</div>
        <h1>Мишины числа</h1>
      </header>

      <div class="games">
        <button class="game-btn game-find" data-game="find">
          <span class="game-icon" aria-hidden="true">🔍</span>
          <span>Найди число</span>
        </button>
        <button class="game-btn game-missing" data-game="missing">
          <span class="game-icon" aria-hidden="true">❓</span>
          <span>Какое число пропало?</span>
        </button>
        <button class="game-btn game-order" data-game="order">
          <span class="game-icon" aria-hidden="true">🪜</span>
          <span>По порядку</span>
        </button>
      </div>

      <div class="settings">
        <div class="setting">
          <span class="setting-label">Числа</span>
          <div class="segmented" role="group" aria-label="Диапазон чисел">
            <button type="button" data-range="10" aria-pressed="true">1–10</button>
            <button type="button" data-range="20" aria-pressed="false">1–20</button>
          </div>
        </div>
        <button type="button" id="sound-toggle" class="sound-toggle" aria-pressed="true">🔊 Озвучка</button>
        <p id="sound-note" class="note" hidden>Озвучка недоступна в этом браузере — подсказки будут текстом.</p>
      </div>
    </section>

    <!-- Экран игры -->
    <section id="game" class="screen" hidden>
      <header class="game-head">
        <button type="button" id="to-menu" class="icon-btn" aria-label="В меню">
          <span aria-hidden="true">🏠</span><span class="btn-text">Меню</span>
        </button>
        <div class="stars" aria-label="Звёздочки"><span aria-hidden="true">⭐</span> <span id="stars">0</span></div>
        <button type="button" id="repeat" class="icon-btn" aria-label="Повторить задание">
          <span aria-hidden="true">🔁</span><span class="btn-text">Ещё раз</span>
        </button>
      </header>

      <div id="prompt" class="prompt"></div>
      <div id="board" class="board"></div>

      <div class="bottom">
        <div class="feedback-row">
          <div id="buddy" class="buddy" aria-hidden="true">🐻</div>
          <p id="feedback" class="feedback" aria-live="polite"></p>
        </div>
        <button type="button" id="next" class="next-btn" hidden>Дальше ➜</button>
      </div>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
